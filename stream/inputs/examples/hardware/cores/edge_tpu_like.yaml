# ZigZag's edge_tpu_like core (zigzag/inputs/hardware/edge_tpu_like.yaml) in Stream's format: the in-core DRAM is
# left to the off-chip core, and every memory's energy and area come from CACTI (auto_cost_extraction), so the
# template stays costed when `TemplateExplorationStage` resizes it. The array is 8x8 PEs (D1, D2) of 4x4 MACs
# (D3, D4); no dataflows, so ZigZag searches the spatial mapping of each layer.
name: edge_tpu_like
type: compute

memories:
  rf_1B:
    size: 8
    latency: 1
    mem_type: rf
    auto_cost_extraction: True
    operands: [I2]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 8
        bandwidth_max: 8
        allocation:
          - I2, tl
      - name: w_port_1
        type: write
        bandwidth_min: 8
        bandwidth_max: 8
        allocation:
          - I2, fh
    served_dimensions: [D3, D4]

  rf_2B:
    size: 16
    latency: 1
    mem_type: rf
    auto_cost_extraction: True
    operands: [O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 16
        bandwidth_max: 16
        allocation:
          - O, tl
      - name: r_port_2
        type: read
        bandwidth_min: 16
        bandwidth_max: 16
        allocation:
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 16
        bandwidth_max: 16
        allocation:
          - O, fh
      - name: w_port_2
        type: write
        bandwidth_min: 16
        bandwidth_max: 16
        allocation:
          - O, fl
    served_dimensions: [D2]

  sram_32KB:
    size: 262144
    latency: 1
    mem_type: sram
    auto_cost_extraction: True
    operands: [I2]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 64
        bandwidth_max: 512
        allocation:
          - I2, tl
      - name: w_port_1
        type: write
        bandwidth_min: 64
        bandwidth_max: 512
        allocation:
          - I2, fh
    served_dimensions: [D1, D2, D3, D4]

  sram_2MB:
    size: 16777216
    latency: 1
    mem_type: sram
    auto_cost_extraction: True
    operands: [I1, O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 64
        bandwidth_max: 2048
        allocation:
          - I1, tl
          - O, tl
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 64
        bandwidth_max: 2048
        allocation:
          - I1, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2, D3, D4]

operational_array:
  unit_energy: 0.04 # pJ
  unit_area: 0.00007 # mm^2, core_generator.MAC_UNIT_AREA_MM2
  dimensions: [D1, D2, D3, D4]
  sizes: [8, 8, 4, 4]
