name: fusemax_vec
type: compute

memories:
  rf_pe:
    size: 512  # 32 entries * 16 bits (arch-1d.yaml: reg_file depth=32, width=16)
    r_cost: 0.4
    w_cost: 0.4
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 16
        bandwidth_max: 16
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 16
        bandwidth_max: 16
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: []

  sram:
    size: 134217728
    r_cost: 8192
    w_cost: 8192
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 4096
        bandwidth_max: 131072
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 4096
        bandwidth_max: 131072
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2]

operational_array:
  input_precision: [16, 16]
  unit_energy: 0.1 # pJ
  unit_area: 0.01 # unit
  dimensions: [D1, D2]
  sizes: [256, 1]
